name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e '.[all,dev]'

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check (informational — won't fail the build yet)
        continue-on-error: true
        run: mypy

      - name: Test
        run: pytest tests/ -x --tb=short

      - name: Validate example agent
        run: forge validate examples/delta-neutral-btc/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs
        working-directory: docs-site
        run: npm run build

      - name: Smoke test production docs server
        working-directory: docs-site
        run: |
          npm run start -- --port 3010 > /tmp/aether-forge-docs.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3010/ >/tmp/aether-forge-docs-home.html; then
              # The site is a V2 coming-soon page; old docs and media URLs redirect to it.
              grep -q "is coming soon" /tmp/aether-forge-docs-home.html
              for path in /docs /docs/getting-started /docs/features/x402-payments /videos/00-hero.mp4; do
                location=$(curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3010$path")
                test "$location" = "307 http://localhost:3010/"
              done
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/aether-forge-docs.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/aether-forge-docs.log
          exit 1
