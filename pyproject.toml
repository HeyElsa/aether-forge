[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-forge"
version = "0.1.0"
description = "Spec-first agent builder framework for the open agent economy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  {name = "HeyElsa", email = "ask@heyelsa.ai"},
]
keywords = [
  "agent", "ai", "framework", "spec-first", "policy",
  "crypto", "defi", "x402", "erc-8004", "wallet",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
# Framework contributors: pip install -e .[dev]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.7.0",
  "build",
  "twine",
]
# Real OWS wallets across 9 chains. Without this, agents fall back to
# the simulated wallet provider.
wallet = [
  "open-wallet-standard>=1.2.4",
]
# Long-term semantic + temporal memory layer (Layer 4). Without this,
# agents run on operational SQLite memory only (Layer 3).
knowledge = [
  "mempalace>=3.1.0",
]
# Encrypted wallet backups (AES-256-GCM + scrypt) and encrypted memory
# records. Without this, ``forge wallet-backup`` requires --unencrypted.
security = [
  "cryptography>=42.0.0",
]
# Agent-to-agent communication via Google's A2A protocol.
a2a = [
  "a2a-sdk>=0.3.0",
]
# Everything an end user needs for a production agent.
all = [
  "open-wallet-standard>=1.2.4",
  "mempalace>=3.1.0",
  "cryptography>=42.0.0",
  "a2a-sdk>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/HeyElsa/aether-forge"
Documentation = "https://github.com/HeyElsa/aether-forge#readme"
Repository = "https://github.com/HeyElsa/aether-forge"
Issues = "https://github.com/HeyElsa/aether-forge/issues"

[project.scripts]
forge = "aether_forge.cli:main_cli"
# Foundry (foundry.rs) also installs a binary named `forge`, and the crypto
# developers this framework targets usually have it. `aether` is the
# collision-free alias — identical CLI, pick whichever your PATH prefers.
aether = "aether_forge.cli:main_cli"

# Plugin entry points — third parties extend Aether Forge by declaring entries
# in these groups in their own pyproject.toml. See docs-site/.../guides/extending.mdx.
[project.entry-points."aether_forge.planners"]
# Example: grok = "my_pkg:build_grok_planner"

[project.entry-points."aether_forge.execution_routers"]
# Example: my-router = "my_pkg:build_router"

[project.entry-points."aether_forge.data_sources"]
# Example: private-prices = "my_pkg:PrivatePricesSource"

[project.entry-points."aether_forge.skill_registries"]
# Example: my-registry = "my_pkg.registries:MY_REGISTRY"

[project.entry-points."aether_forge.migrations"]
# Example: my-transforms = "my_pkg.migrations:register_all"
# A plugin in this group MUST resolve to a callable that takes a single
# ``aether_forge.migrations.TransformRegistry`` argument and calls
# ``.register(...)`` on it for each transform it ships.

[tool.pytest.ini_options]
testpaths = ["tests"]

# mypy is informational for now — public-API surface is checked but the
# rest of the codebase has not been swept for strict typing yet. Flip
# `strict = true` to the wider `files` list once the surface is clean.
[tool.mypy]
python_version = "3.12"
files = [
  "src/aether_forge/__init__.py",
  "src/aether_forge/runtime.py",
  "src/aether_forge/planner.py",
  "src/aether_forge/policy.py",
  "src/aether_forge/memory.py",
  "src/aether_forge/data_layer.py",
  "src/aether_forge/plugins.py",
]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Optional deps — don't fail when they're not present.
[[tool.mypy.overrides]]
module = [
  "mempalace.*",
  "open_wallet_standard.*",
  "cryptography.*",
  "a2a.*",
  "a2a_sdk.*",
  "chromadb.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aether_forge = ["schemas/**/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line too long (we set 120)
  "E402",   # module-level import not at top (intentional for lazy CLI loading)
  "B904",   # raise without `from` (intentional where we hide framework stack)
  "B905",   # zip() without strict= (3.12 default behavior is fine)
  "E741",   # ambiguous variable name
  "SIM105", # try/except/pass → contextlib.suppress (stylistic)
  "SIM108", # if-else → ternary (stylistic)
  "SIM102", # nested if (sometimes intentional for readability)
  "SIM103", # needless bool (stylistic)
  "SIM118", # in dict.keys() (sometimes intentional for explicitness)
  "F841",   # unused local — sometimes intentional for clarity / catch
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F841", "F401"]  # assert False + unused locals/imports OK in tests
"src/aether_forge/cli.py" = ["F401"]  # re-exports for plugin/CLI surface
"src/aether_forge/__init__.py" = ["F401"]  # public API re-exports
"src/aether_forge/crypto/__init__.py" = ["F401"]  # public API re-exports
"src/aether_forge/adapters/__init__.py" = ["F401"]  # public API re-exports
"src/aether_forge/protocols/__init__.py" = ["F401"]  # public API re-exports
