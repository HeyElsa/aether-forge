# Pre-commit hooks for Aether Forge contributors.
# Install once: pre-commit install
# Run on demand: pre-commit run --all-files
#
# These hooks match what CI checks, so running them locally catches
# the same failures before push.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown trailing-whitespace can be intentional (line break)
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # The framework's example artifacts intentionally include comment-like
        # placeholder strings; they're still valid JSON.
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      # Catches import-time errors in <2s without running the suite.
      - id: pytest-collect
        name: pytest --collect-only (catches import-time errors)
        entry: pytest --collect-only -q
        language: system
        types: [python]
        pass_filenames: false
